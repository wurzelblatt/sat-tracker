version: 2

models:
  - name: space_object
    description: >
      Deduplicated current state of the CelesTrak satellite catalogue,
      one row per norad_cat_id. Cleaning only — the newest landing wins,
      because CelesTrak revises an object's row in place rather than
      publishing a new dated record. Business flags live in
      gold.dim_object.
    data_tests:
      # CelesTrak reports decay two ways: an ops_status_code of 'D' and a
      # populated decay_date. They agree across all ~70,000 rows today,
      # and gold.is_decayed trusts decay_date alone — so a disagreement
      # would silently change which objects get propagated.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(ops_status_code = 'D') = (decay_date is not null)"
    columns:
      - name: norad_cat_id
        description: >
          NORAD catalog number, the grain of this table. Six digits since
          July 2026.
        data_tests:
          - unique
          - not_null

      - name: object_type
        description: PAY (payload), R/B (rocket body), DEB (debris) or UNK.
        data_tests:
          - not_null

      - name: ingest_ts
        description: When the landing behind this version of the row was fetched.
        data_tests:
          - not_null

  - name: elset
    description: >
      Deduplicated, SCD-2 historised orbital element sets, one row per
      (norad_cat_id, epoch). valid_from/valid_to are derived from epoch
      rather than from ingestion time, so validity reflects when the
      orbit was measured, not when the pipeline happened to run.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - norad_cat_id
              - epoch
    columns:
      - name: norad_cat_id
        description: NORAD catalog number. Six digits since July 2026.
        data_tests:
          - not_null

      - name: epoch
        description: UTC instant this element set describes.
        data_tests:
          - not_null

      - name: valid_from
        description: Start of this element set's authority. Equals epoch.
        data_tests:
          - not_null

      - name: valid_to
        description: >
          Epoch of the next element set for this satellite; NULL for the
          current one. Nullable by design.

      - name: is_current
        description: True for the newest element set per satellite.
        data_tests:
          - not_null

      - name: eccentricity
        description: >
          Orbital eccentricity. Bounded [0, 1) — a value at or above 1
          is a parabolic/hyperbolic trajectory, i.e. bad data rather
          than an Earth orbit.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and eccentricity < 1"

      - name: inclination
        description: Orbital inclination in degrees, bounded [0, 180].
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and inclination <= 180"

      - name: ra_of_asc_node
        description: Right ascension of the ascending node, degrees [0, 360).
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and ra_of_asc_node < 360"

      - name: arg_of_pericenter
        description: Argument of pericenter, degrees [0, 360).
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and arg_of_pericenter < 360"

      - name: mean_anomaly
        description: Mean anomaly, degrees [0, 360).
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and mean_anomaly < 360"

      - name: mean_motion
        description: >
          Revolutions per day. Positive, and below ~20 for any object
          actually in orbit rather than re-entering.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0 and mean_motion < 20"
